---
# RepoReady by Harlo (Digital Promo Hub) - Python test matrix
name: CI Python
"on":
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
      - name: Test (pytest, unittest fallback)
        run: |
          if pip install pytest && python -m pytest --version >/dev/null 2>&1 && ls -- tests test_*.py ./*/test_*.py >/dev/null 2>&1; then
            python -m pytest -q
          else
            python -m unittest discover -v
          fi
